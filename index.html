<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Karobaar — Turn Work Into Growth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100vw;
        background-color: #000000;
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('karobaar-theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var accent = localStorage.getItem('karobaar-accent') || 'default';
          document.documentElement.setAttribute('data-accent', accent);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000000;color:#ffffff;user-select:none;">
        <div style="display:flex;align-items:flex-end;gap:5px;margin-bottom:20px;">
          <div style="width:8px;height:18px;background:#ffffff;border-radius:4px;"></div>
          <div style="width:8px;height:28px;background:#ffffff;border-radius:4px;"></div>
          <div style="width:8px;height:40px;background:#ffffff;border-radius:4px;"></div>
        </div>
        <div style="font-size:1.4rem;font-weight:700;letter-spacing:0.02em;">Karobaar</div>
        <div style="font-size:0.8rem;color:rgba(255,255,255,0.7);margin-top:6px;letter-spacing:0.02em;">Turn Work Into Growth.</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
