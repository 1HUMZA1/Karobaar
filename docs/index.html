<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-VDsz6_A7.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Karobaar — Turn Work Into Growth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --splash-bg: #f1f3f6;
        --splash-text: #09090b;
        --splash-subtext: #52525b;
        --splash-bar-bg: rgba(9, 9, 11, 0.12);
        --splash-bar-fill: #09090b;
      }
      [data-theme="dark"] {
        --splash-bg: #09090b;
        --splash-text: #ffffff;
        --splash-subtext: #a1a1aa;
        --splash-bar-bg: rgba(255, 255, 255, 0.15);
        --splash-bar-fill: #ffffff;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--splash-bg);
        color: var(--splash-text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100vw;
        background-color: var(--splash-bg);
      }
      @keyframes karobaarShimmer {
        0% { transform: translateX(-100%); width: 35%; }
        50% { transform: translateX(65%); width: 55%; }
        100% { transform: translateX(260%); width: 35%; }
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.92; }
      }
      .splash-logo-box {
        animation: pulseLogo 2.4s ease-in-out infinite;
      }
      .splash-quote {
        display: inline-block;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        font-style: italic;
        color: var(--splash-subtext);
        font-size: 0.92rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-align: center;
        max-width: 380px;
        line-height: 1.4;
        will-change: opacity, transform;
      }
      .splash-quote.quote-out {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
      }
      .splash-quote.quote-in {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .splash-quote.quote-prep {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        transition: none !important;
      }
    </style>
    <script>
      (function() {
        if (window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs/')) {
          var target = window.location.pathname.replace(/\/+$/, '') + '/docs/' + window.location.search + (window.location.hash || '#/dashboard');
          window.location.replace(target);
          return;
        }
        try {
          var theme = localStorage.getItem('karobaar-theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var accent = localStorage.getItem('karobaar-accent') || 'default';
          document.documentElement.setAttribute('data-accent', accent);
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CpIHQiBe.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BkzGZNEX.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="root">
      <div id="loading-screen" style="height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--splash-bg);color:var(--splash-text);user-select:none;padding:24px;box-sizing:border-box;">
        <div class="splash-logo-box" style="width:78px;height:78px;border:3.5px solid var(--splash-text);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:800;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,0.06);line-height:1;">K</div>
        <div style="font-size:2.5rem;font-weight:800;letter-spacing:-0.03em;color:var(--splash-text);margin-bottom:8px;line-height:1.1;">Karobaar</div>
        <div style="font-size:1.18rem;font-weight:500;color:var(--splash-subtext);letter-spacing:0.01em;margin-bottom:28px;">Turn Work Into Growth.</div>
        
        <!-- 100 Countdown Progress Bar -->
        <div style="width:260px;max-width:85vw;height:6px;background:var(--splash-bar-bg);border-radius:9999px;overflow:hidden;position:relative;margin-bottom:12px;">
          <div id="splash-bar-fill" style="width:0%;height:100%;background:var(--splash-bar-fill);border-radius:9999px;transition:width 0.16s cubic-bezier(0.16, 1, 0.3, 1);"></div>
        </div>
        
        <!-- Counter & Workspace Status Row -->
        <div style="width:260px;max-width:85vw;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <span id="splash-status-text" style="font-size:0.85rem;font-weight:500;color:var(--splash-subtext);letter-spacing:0.01em;">Initializing workspace...</span>
          <span id="splash-count-percent" style="font-size:0.92rem;font-weight:700;color:var(--splash-text);font-variant-numeric:tabular-nums;letter-spacing:0.02em;">0%</span>
        </div>

        <!-- Rotating Motivational Quotes with Fade-In & Fade-Out -->
        <div style="min-height:46px;display:flex;align-items:center;justify-content:center;max-width:380px;text-align:center;padding:0 16px;">
          <span id="splash-quote-text" class="splash-quote quote-in">“Where Effort Becomes Progress.”</span>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var quotes = [
          "“Where Effort Becomes Progress.”",
          "“Work Smarter. Grow Faster.”",
          "“Plan Better. Achieve More.”",
          "“Built to Simplify. Designed to Grow.”",
          "“Smarter Tools. Stronger Businesses.”",
          "“Turning Ambition Into Achievement.”",
          "“Every Transaction, Seamlessly Managed.”",
          "“Your Business. Your Progress.”",
          "“Make Every Move Count.”",
          "“Turn Work Into Growth.”"
        ];
        var qIdx = 0;
        var quoteEl = document.getElementById('splash-quote-text');
        var barEl = document.getElementById('splash-bar-fill');
        var percentEl = document.getElementById('splash-count-percent');
        var statusEl = document.getElementById('splash-status-text');

        // Smooth quote rotation with fade out and fade in
        function rotateQuote() {
          if (!quoteEl) return;
          quoteEl.className = 'splash-quote quote-out';
          setTimeout(function() {
            qIdx = (qIdx + 1) % quotes.length;
            quoteEl.textContent = quotes[qIdx];
            quoteEl.className = 'splash-quote quote-prep';
            void quoteEl.offsetHeight; // force reflow
            quoteEl.className = 'splash-quote quote-in';
          }, 380);
        }
        var quoteInterval = setInterval(rotateQuote, 2100);

        // Smooth 0 to 100 countdown progress ticker
        var currentProgress = 0;
        var statuses = [
          { at: 15, text: "Initializing workspace..." },
          { at: 40, text: "Syncing business records..." },
          { at: 70, text: "Loading modules..." },
          { at: 92, text: "Finalizing workspace..." },
          { at: 100, text: "Ready." }
        ];

        var progressTimer = setInterval(function() {
          if (currentProgress >= 100) {
            clearInterval(progressTimer);
            return;
          }
          var step = Math.floor(Math.random() * 5) + 3;
          currentProgress = Math.min(100, currentProgress + step);
          if (barEl) barEl.style.width = currentProgress + '%';
          if (percentEl) percentEl.textContent = currentProgress + '%';

          for (var i = statuses.length - 1; i >= 0; i--) {
            if (currentProgress >= statuses[i].at) {
              if (statusEl && statusEl.textContent !== statuses[i].text) {
                statusEl.textContent = statuses[i].text;
              }
              break;
            }
          }
        }, 50);

        window.__clearKarobaarSplashTimers = function() {
          clearInterval(quoteInterval);
          clearInterval(progressTimer);
        };
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
