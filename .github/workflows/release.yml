name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (for Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap copy android

      - name: Build Windows Executable
        run: npx electron-packager . Karobaar --platform=win32 --arch=x64 --out=desktop-build-latest --overwrite --ignore="^/android|Karobaar_Final_Apps"
        
      - name: Zip Windows App
        run: |
          Compress-Archive -Path desktop-build-latest\Karobaar-win32-x64 -DestinationPath Karobaar-Windows-v1.1.0.zip -Force

      - name: Build Android APK
        working-directory: ./android
        run: .\gradlew assembleDebug

      - name: Build Android AAB
        working-directory: ./android
        run: .\gradlew bundleDebug
        
      - name: Rename Android APK and AAB
        run: |
          Move-Item "android\app\build\outputs\apk\debug\app-debug.apk" "Karobaar-Android-v1.1.0.apk"
          Move-Item "android\app\build\outputs\bundle\debug\app-debug.aab" "Karobaar-Android-v1.1.0.aab"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v1.1.0"
          files: |
            Karobaar-Windows-v1.1.0.zip
            Karobaar-Android-v1.1.0.apk
            Karobaar-Android-v1.1.0.aab
          generate_release_notes: false
